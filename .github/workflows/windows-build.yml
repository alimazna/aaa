```yaml
name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DXAUUSD_BUILD_UI=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "build\Release\xauusd_ui.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "EXE not found: $exe"
            exit 1
          }

          Write-Host "EXE found:"
          Get-Item $exe | Select-Object FullName, Length

      - name: Create package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

          Copy-Item "build\Release\xauusd_ui.exe" "package\xauusd_ui.exe"

          if (Test-Path "config") {
            Copy-Item "config" "package\config" -Recurse
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" "package\README.md"
          }

          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "XAUUSD_Sovereign_Windows_x64.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Sovereign-Windows-x64
          path: XAUUSD_Sovereign_Windows_x64.zip
          if-no-files-found: error
```
