name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    env:
      BUILD_DIR: build
      PACKAGE_DIR: package
      BUILD_TYPE: Release
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show toolchain versions
        shell: pwsh
        run: |
          Write-Host "=== CMake ==="
          cmake --version

          Write-Host "=== Python ==="
          python --version

          Write-Host "=== Git ==="
          git --version

          Write-Host "=== Vcpkg ==="
          & "$env:VCPKG_ROOT\vcpkg.exe" version

          Write-Host "=== Visual Studio ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Directory |
            Select-Object -ExpandProperty FullName

      - name: Install required C++ dependency - curl
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install curl:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B "$env:BUILD_DIR" `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DXAUUSD_BUILD_UI=ON

      - name: Build Release
        shell: pwsh
        run: |
          cmake `
            --build "$env:BUILD_DIR" `
            --config "$env:BUILD_TYPE" `
            --parallel

      - name: Run tests
        shell: pwsh
        run: |
          ctest `
            --test-dir "$env:BUILD_DIR" `
            -C "$env:BUILD_TYPE" `
            --output-on-failure

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = Join-Path "$env:BUILD_DIR" "$env:BUILD_TYPE\xauusd_ui.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Executable not found: $exe"
            exit 1
          }

          Write-Host "Executable found:"
          Get-Item $exe | Format-List FullName, Length, LastWriteTime

      - name: Prepare Windows package
        shell: pwsh
        run: |
          if (Test-Path "$env:PACKAGE_DIR") {
            Remove-Item "$env:PACKAGE_DIR" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "$env:PACKAGE_DIR" `
            -Force | Out-Null

          # Main executable
          Copy-Item `
            "$env:BUILD_DIR\$env:BUILD_TYPE\xauusd_ui.exe" `
            "$env:PACKAGE_DIR\xauusd_ui.exe" `
            -Force

          # Project configuration
          if (Test-Path "config") {
            Copy-Item `
              "config" `
              "$env:PACKAGE_DIR\config" `
              -Recurse `
              -Force
          }

          # Documentation
          if (Test-Path "README.md") {
            Copy-Item `
              "README.md" `
              "$env:PACKAGE_DIR\README.md" `
              -Force
          }

